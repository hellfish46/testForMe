                                className="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-black/30 border border-primary-200 dark:border-primary-800 focus:border-primary-500 focus:outline-none transition-colors text-primary-900 dark:text-primary-100" placeholder="e.g., cute, retro, minimalist, cyberpunk..." />
                        </div>

                        <div className="mb-6">
                            <div className="flex items-center justify-between mb-2">
                                <label className="block text-sm font-medium text-primary-700 dark:text-primary-300">Project Brief *</label>
                                <button type="button" onClick={generateAIBrief} disabled={aiLoading}
                                    className="text-xs bg-primary-500 hover:bg-primary-600 text-white px-3 py-1.5 rounded-full transition-colors flex items-center gap-1">
                                    <i className={`fa-solid ${aiLoading ? 'fa-spinner fa-spin' : 'fa-wand-magic-sparkles'}`}></i>
                                    {aiLoading ? 'Generating...' : 'AI Help'}
                                </button>
                            </div>
                            <textarea required rows={5} value={formData.brief} onChange={e => setFormData({...formData, brief: e.target.value})}
                                className="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-black/30 border border-primary-200 dark:border-primary-800 focus:border-primary-500 focus:outline-none transition-colors text-primary-900 dark:text-primary-100 resize-none"
                                placeholder="Describe your vision, references, colors, mood, intended use..." />
                        </div>

                        <div className="mb-6">
                            <label className="block text-sm font-medium text-primary-700 dark:text-primary-300 mb-2">Deadline (optional)</label>
                            <input type="date" value={formData.deadline} onChange={e => setFormData({...formData, deadline: e.target.value})}
                                className="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-black/30 border border-primary-200 dark:border-primary-800 focus:border-primary-500 focus:outline-none transition-colors text-primary-900 dark:text-primary-100" />
                        </div>

                        <div className="mb-8">
                            <label className="block text-sm font-medium text-primary-700 dark:text-primary-300 mb-2">Reference Images</label>
                            <div className="border-2 border-dashed border-primary-300 dark:border-primary-700 rounded-xl p-6 text-center hover:border-primary-500 transition-colors cursor-pointer">
                                <input type="file" multiple accept="image/*" onChange={handleFileChange} className="hidden" id="file-upload" />
                                <label htmlFor="file-upload" className="cursor-pointer">
                                    <i className="fa-solid fa-cloud-arrow-up text-3xl text-primary-400 mb-3"></i>
                                    <p className="text-sm text-primary-600 dark:text-primary-400">Click to upload or drag and drop</p>
                                    <p className="text-xs text-primary-500 mt-1">PNG, JPG, GIF up to 10MB each</p>
                                </label>
                            </div>
                            {files.length > 0 && (
                                <div className="mt-3 flex flex-wrap gap-2">
                                    {files.map((file, i) => (
                                        <span key={i} className="text-xs bg-primary-100 dark:bg-primary-900 text-primary-700 dark:text-primary-300 px-3 py-1 rounded-full flex items-center gap-1">
                                            <i className="fa-solid fa-image"></i> {file.name}
                                        </span>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="text-center">
                            <button type="submit" className="bg-primary-500 hover:bg-primary-600 text-white px-12 py-4 rounded-full font-medium text-lg transition-all hover:shadow-xl hover:shadow-primary-500/30">
                                Send Request
                            </button>
                            <p className="mt-4 text-sm text-primary-500">No payment required now. I'll send a quote first.</p>
                        </div>
                    </motion.form>
                </section>
            );
        };

        const Contact = () => {
            const [formStatus, setFormStatus] = useState(null);

            const handleSubmit = (e) => {
                e.preventDefault();
                setFormStatus('success');
                setTimeout(() => setFormStatus(null), 3000);
            };

            return (
                <section className="py-24 px-4 sm:px-6 lg:px-8 max-w-6xl mx-auto">
                    <SectionTitle subtitle="Have a question or just want to say hi? I'd love to hear from you.">Get In Touch</SectionTitle>

                    <div className="grid md:grid-cols-2 gap-12">
                        <motion.div initial={{ opacity: 0, x: -30 }} whileInView={{ opacity: 1, x: 0 }} viewport={{ once: true }}>
                            <div className="space-y-6">
                                <GlassCard className="flex items-center gap-4">
                                    <div className="w-12 h-12 rounded-full bg-primary-500/20 flex items-center justify-center text-primary-500 text-xl">
                                        <i className="fa-solid fa-envelope"></i>
                                    </div>
                                    <div>
                                        <h4 className="font-semibold text-primary-900 dark:text-primary-100">Email</h4>
                                        <p className="text-sm text-primary-600 dark:text-primary-400">hello@meemaart.studio</p>
                                    </div>
                                </GlassCard>

                                <GlassCard className="flex items-center gap-4">
                                    <div className="w-12 h-12 rounded-full bg-primary-500/20 flex items-center justify-center text-primary-500 text-xl">
                                        <i className="fa-brands fa-discord"></i>
                                    </div>
                                    <div>
                                        <h4 className="font-semibold text-primary-900 dark:text-primary-100">Discord</h4>
                                        <p className="text-sm text-primary-600 dark:text-primary-400">@meemaart</p>
                                    </div>
                                </GlassCard>

                                <GlassCard className="flex items-center gap-4">
                                    <div className="w-12 h-12 rounded-full bg-primary-500/20 flex items-center justify-center text-primary-500 text-xl">
                                        <i className="fa-brands fa-twitter"></i>
                                    </div>
                                    <div>
                                        <h4 className="font-semibold text-primary-900 dark:text-primary-100">Twitter / X</h4>
                                        <p className="text-sm text-primary-600 dark:text-primary-400">@meemaart</p>
                                    </div>
                                </GlassCard>

                                <GlassCard className="flex items-center gap-4">
                                    <div className="w-12 h-12 rounded-full bg-primary-500/20 flex items-center justify-center text-primary-500 text-xl">
                                        <i className="fa-brands fa-instagram"></i>
                                    </div>
                                    <div>
                                        <h4 className="font-semibold text-primary-900 dark:text-primary-100">Instagram</h4>
                                        <p className="text-sm text-primary-600 dark:text-primary-400">@meemaart.studio</p>
                                    </div>
                                </GlassCard>
                            </div>
                        </motion.div>

                        <motion.div initial={{ opacity: 0, x: 30 }} whileInView={{ opacity: 1, x: 0 }} viewport={{ once: true }} transition={{ delay: 0.2 }}>
                            <form onSubmit={handleSubmit} className="glass dark:glass-dark rounded-3xl p-8">
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-primary-700 dark:text-primary-300 mb-2">Name</label>
                                        <input required type="text" className="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-black/30 border border-primary-200 dark:border-primary-800 focus:border-primary-500 focus:outline-none transition-colors text-primary-900 dark:text-primary-100" placeholder="Your name" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-primary-700 dark:text-primary-300 mb-2">Email</label>
                                        <input required type="email" className="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-black/30 border border-primary-200 dark:border-primary-800 focus:border-primary-500 focus:outline-none transition-colors text-primary-900 dark:text-primary-100" placeholder="your@email.com" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-primary-700 dark:text-primary-300 mb-2">Message</label>
                                        <textarea required rows={5} className="w-full px-4 py-3 rounded-xl bg-white/50 dark:bg-black/30 border border-primary-200 dark:border-primary-800 focus:border-primary-500 focus:outline-none transition-colors text-primary-900 dark:text-primary-100 resize-none" placeholder="Your message..."></textarea>
                                    </div>
                                    <button type="submit" className="w-full bg-primary-500 hover:bg-primary-600 text-white py-3 rounded-xl font-medium transition-all hover:shadow-lg">
                                        Send Message
                                    </button>
                                    {formStatus === 'success' && (
                                        <motion.p initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} className="text-green-500 text-center text-sm">
                                            <i className="fa-solid fa-check-circle mr-1"></i> Message sent successfully!
                                        </motion.p>
                                    )}
                                </div>
                            </form>
                        </motion.div>
                    </div>
                </section>
            );
        };

        const AIChatWidget = () => {
            const [open, setOpen] = useState(false);
            const [messages, setMessages] = useState([{ role: 'assistant', content: "Hi! I'm Meema's AI assistant. Ask me about commissions, pricing, or artwork styles!" }]);
            const [input, setInput] = useState("");
            const [typing, setTyping] = useState(false);
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            useEffect(scrollToBottom, [messages]);

            const sendMessage = async (text) => {
                if (!text.trim()) return;
                setMessages(prev => [...prev, { role: 'user', content: text }]);
                setInput("");
                setTyping(true);

                await new Promise(r => setTimeout(r, 1000 + Math.random() * 1000));

                const responses = [
                    "I'd be happy to help with that! For custom illustrations, I typically work in a whimsical, vibrant style. Would you like to see some examples?",
                    "Great question! My commission process starts with a detailed brief, followed by sketch approval, then final artwork. Turnaround is usually 2-4 weeks.",
                    "For Twitch packages, I offer complete bundles including emotes, badges, panels, and overlays. Pricing starts at $150 for a basic package.",
                    "I specialize in character art, streaming assets, and brand identity. My style ranges from cute kawaii to sleek cyberpunk aesthetics.",
                    "You can check out my portfolio for examples of my work! I have sections for illustrations, Twitch assets, Discord emotes, and more."
                ];

                setMessages(prev => [...prev, { role: 'assistant', content: responses[Math.floor(Math.random() * responses.length)] }]);
                setTyping(false);
            };

            return (
                <>
                    <motion.button onClick={() => setOpen(!open)} 
                        className="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-primary-500 text-white shadow-lg hover:bg-primary-600 flex items-center justify-center text-2xl"
                        whileHover={{ scale: 1.1 }} whileTap={{ scale: 0.9 }}>
                        <i className={`fa-solid ${open ? 'fa-xmark' : 'fa-robot'}`}></i>
                    </motion.button>

                    <AnimatePresence>
                        {open && (
                            <motion.div initial={{ opacity: 0, y: 20, scale: 0.95 }} animate={{ opacity: 1, y: 0, scale: 1 }} exit={{ opacity: 0, y: 20, scale: 0.95 }}
                                className="fixed bottom-24 right-6 z-40 w-80 md:w-96 glass dark:glass-dark rounded-2xl shadow-2xl overflow-hidden">
                                <div className="bg-primary-500 text-white p-4 flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center"><i className="fa-solid fa-robot"></i></div>
                                    <div>
                                        <h4 className="font-semibold text-sm">Meema AI Assistant</h4>
                                        <p className="text-xs text-primary-100">Always here to help</p>
                                    </div>
                                </div>
                                <div className="h-80 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                                    {messages.map((msg, i) => (
                                        <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[80%] px-4 py-2 rounded-2xl text-sm ${msg.role === 'user' ? 'bg-primary-500 text-white rounded-br-md' : 'bg-primary-100 dark:bg-primary-900 text-primary-800 dark:text-primary-200 rounded-bl-md'}`}>
                                                {msg.content}
                                            </div>
                                        </div>
                                    ))}
                                    {typing && (
                                        <div className="flex justify-start">
                                            <div className="bg-primary-100 dark:bg-primary-900 px-4 py-2 rounded-2xl rounded-bl-md">
                                                <div className="flex gap-1">
                                                    <div className="w-2 h-2 bg-primary-400 rounded-full animate-bounce"></div>
                                                    <div className="w-2 h-2 bg-primary-400 rounded-full animate-bounce" style={{animationDelay: '0.1s'}}></div>
                                                    <div className="w-2 h-2 bg-primary-400 rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                    <div ref={messagesEndRef} />
                                </div>
                                <form onSubmit={(e) => { e.preventDefault(); sendMessage(input); }} className="p-4 border-t border-primary-200 dark:border-primary-800">
                                    <div className="flex gap-2">
                                        <input type="text" value={input} onChange={(e) => setInput(e.target.value)}
                                            placeholder="Ask about commissions..."
                                            className="flex-1 px-4 py-2 rounded-full bg-white/50 dark:bg-black/30 border border-primary-200 dark:border-primary-800 focus:border-primary-500 focus:outline-none text-sm text-primary-900 dark:text-primary-100" />
                                        <button type="submit" className="w-10 h-10 rounded-full bg-primary-500 text-white flex items-center justify-center hover:bg-primary-600 transition-colors">
                                            <i className="fa-solid fa-paper-plane text-sm"></i>
                                        </button>
                                    </div>
                                </form>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </>
            );
        };

        const Footer = ({ setPage }) => (
            <footer className="bg-primary-900 text-white py-16 px-4">
                <div className="max-w-7xl mx-auto">
                    <div className="grid md:grid-cols-4 gap-10 mb-12">
                        <div>
                            <h3 className="font-heading text-2xl font-bold mb-4">MeemaArt</h3>
                            <p className="text-primary-300 text-sm leading-relaxed">Premium digital illustrations, streaming assets, and custom commissions crafted with passion and precision.</p>
                        </div>
                        <div>
                            <h4 className="font-semibold mb-4">Quick Links</h4>
                            <ul className="space-y-2 text-sm text-primary-300">
                                <li><button onClick={() => setPage("portfolio")} className="hover:text-white transition-colors">Portfolio</button></li>
                                <li><button onClick={() => setPage("services")} className="hover:text-white transition-colors">Services</button></li>
                                <li><button onClick={() => setPage("pricing")} className="hover:text-white transition-colors">Pricing</button></li>
                                <li><button onClick={() => setPage("about")} className="hover:text-white transition-colors">About</button></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="font-semibold mb-4">Services</h4>
                            <ul className="space-y-2 text-sm text-primary-300">
                                <li>Twitch Graphics</li>
                                <li>Discord Emotes</li>
                                <li>Custom Illustrations</li>
                                <li>Brand Identity</li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="font-semibold mb-4">Connect</h4>
                            <div className="flex gap-4">
                                <a href="#" className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-primary-500 transition-colors"><i className="fa-brands fa-twitter"></i></a>
                                <a href="#" className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-primary-500 transition-colors"><i className="fa-brands fa-instagram"></i></a>
                                <a href="#" className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-primary-500 transition-colors"><i className="fa-brands fa-discord"></i></a>
                                <a href="#" className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-primary-500 transition-colors"><i className="fa-brands fa-behance"></i></a>
                            </div>
                        </div>
                    </div>
                    <div className="border-t border-primary-800 pt-8 flex flex-col md:flex-row justify-between items-center gap-4">
                        <p className="text-sm text-primary-400"> 2026 MeemaArt Studio. All rights reserved.</p>
                        <button onClick={() => setPage("commission")} className="bg-primary-500 hover:bg-primary-600 text-white px-6 py-2 rounded-full text-sm font-medium transition-all">
                            Start a Project
                        </button>
                    </div>
                </div>
            </footer>
        );

        const App = () => {
            const [page, setPage] = useState("home");
            const [darkMode, setDarkMode] = useState(false);
            const [selectedProject, setSelectedProject] = useState(null);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [page]);

            const renderPage = () => {
                switch(page) {
                    case "home": return <Hero setPage={setPage} />;
                    case "portfolio": return <Portfolio setPage={setPage} setSelectedProject={setSelectedProject} />;
                    case "project-detail": return <ProjectDetail project={selectedProject} setPage={setPage} />;
                    case "services": return <Services setPage={setPage} />;
                    case "pricing": return <Pricing setPage={setPage} />;
                    case "about": return <About setPage={setPage} />;
                    case "commission": return <CommissionForm />;
                    case "contact": return <Contact />;
                    default: return <Hero setPage={setPage} />;
                }
            };

            return (
                <div className="min-h-screen">
                    <Navbar currentPage={page} setPage={setPage} darkMode={darkMode} setDarkMode={setDarkMode} />
                    <AnimatePresence mode="wait">
                        <motion.main
                            key={page}
                            initial={{ opacity: 0, y: 20 }}
                            animate={{ opacity: 1, y: 0 }}
                            exit={{ opacity: 0, y: -20 }}
                            transition={{ duration: 0.3 }}
                        >
                            {renderPage()}
                        </motion.main>
                    </AnimatePresence>
                    <Footer setPage={setPage} />
                    <AIChatWidget />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
